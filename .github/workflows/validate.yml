name: Validate learning materials

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebooks and assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("Module 2").glob("*.ipynb"))
          assert notebooks, "No notebooks found"
          for notebook in notebooks:
              json.loads(notebook.read_text(encoding="utf-8"))

          for asset in ("lenna.png", "baboon.png", "barbara.png"):
              assert (Path("Module 2") / asset).is_file(), f"Missing asset: {asset}"
          PY
